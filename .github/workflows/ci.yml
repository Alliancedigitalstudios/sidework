name: ci
on: [push, pull_request]
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Test the engine in isolation so unbuilt mobile dependencies never block CI.
      - run: cp -r packages/engine /tmp/engine
      - run: npm install --no-save typescript@5.6 vitest@2.1
        working-directory: /tmp/engine
      - run: npx tsc --noEmit
        working-directory: /tmp/engine
      - run: npx vitest run
        working-directory: /tmp/engine
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
